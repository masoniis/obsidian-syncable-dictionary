name: release-please

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # PRs opened with the default GITHUB_TOKEN don't trigger other workflows,
      # so the release PR would never get its required checks. an app token avoids that.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # opens/updates the release PR, or creates the tag + GitHub release once it's merged
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # to upload assets to the GitHub release
      actions: write # required for deleting github cache entries in nix setup
      id-token: write # required for artifact attestations
      attestations: write # required for artifact attestations
    steps:
      - uses: actions/checkout@v7

      - name: Add nix flake profile
        uses: ./.github/actions/add-nix-flake-profile
        with:
          flake-profile: "bun"

      - name: Build plugin
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" main.js manifest.json styles.css --clobber
